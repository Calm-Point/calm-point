<title>Calm Point — Mental health care that meets you where you are</title>
<meta name="description" content="The Calm Point telehealth app: check in, sign up, book and attend a video visit, message your care team, talk with an AI companion, and track your care." />

<style>
  :root{
    --paper:#f7f6f3;--surface:#fff;--surface-2:#fbfaf8;--ink:#1c1e26;--ink-soft:#565a67;--ink-faint:#8b8f9a;
    --brand:#3e6b5c;--brand-deep:#2f5347;--brand-tint:#e8f0ec;--clay:#c58a5a;--danger:#a8443b;--positive:#3d8168;
    --hairline:rgba(28,30,38,.08);--glass:rgba(255,255,255,.68);
    --shadow-soft:0 1px 2px rgba(28,30,38,.04),0 12px 32px rgba(28,30,38,.07);
    --shadow-lift:0 2px 4px rgba(28,30,38,.05),0 22px 48px rgba(28,30,38,.12);
    --sans:ui-sans-serif,-apple-system,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
    --ease:cubic-bezier(.32,.72,0,1);
  }
  @media (prefers-color-scheme:dark){:root{--paper:#0f1115;--surface:#171a21;--surface-2:#1c2029;--ink:#f2f1ec;--ink-soft:#a4a9b5;--ink-faint:#767b88;--brand:#7fb8a4;--brand-deep:#9bcbba;--brand-tint:#1e2b27;--clay:#d9a87c;--danger:#e07a70;--positive:#6fb39a;--hairline:rgba(242,241,236,.1);--glass:rgba(23,26,33,.62);--shadow-soft:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);--shadow-lift:0 2px 4px rgba(0,0,0,.5),0 22px 48px rgba(0,0,0,.6)}}
  :root[data-theme="light"]{--paper:#f7f6f3;--surface:#fff;--surface-2:#fbfaf8;--ink:#1c1e26;--ink-soft:#565a67;--ink-faint:#8b8f9a;--brand:#3e6b5c;--brand-deep:#2f5347;--brand-tint:#e8f0ec;--clay:#c58a5a;--danger:#a8443b;--positive:#3d8168;--hairline:rgba(28,30,38,.08);--glass:rgba(255,255,255,.68);--shadow-soft:0 1px 2px rgba(28,30,38,.04),0 12px 32px rgba(28,30,38,.07);--shadow-lift:0 2px 4px rgba(28,30,38,.05),0 22px 48px rgba(28,30,38,.12)}
  :root[data-theme="dark"]{--paper:#0f1115;--surface:#171a21;--surface-2:#1c2029;--ink:#f2f1ec;--ink-soft:#a4a9b5;--ink-faint:#767b88;--brand:#7fb8a4;--brand-deep:#9bcbba;--brand-tint:#1e2b27;--clay:#d9a87c;--danger:#e07a70;--positive:#6fb39a;--hairline:rgba(242,241,236,.1);--glass:rgba(23,26,33,.62);--shadow-soft:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);--shadow-lift:0 2px 4px rgba(0,0,0,.5),0 22px 48px rgba(0,0,0,.6)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.02em;line-height:1.15}
  p{margin:0}a{color:inherit}button{font:inherit}
  .wrap{width:100%;max-width:940px;margin:0 auto;padding:0 22px}
  .app-wrap{width:100%;max-width:760px;margin:0 auto;padding:0 20px}
  .field{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
  .field canvas{width:100%;height:100%;display:block}

  header.bar{position:sticky;top:0;z-index:40;backdrop-filter:saturate(1.5) blur(20px);-webkit-backdrop-filter:saturate(1.5) blur(20px);background:var(--glass);border-bottom:1px solid var(--hairline)}
  .bar-in{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;cursor:pointer}
  .mark{width:25px;height:25px}
  .bar-links{display:flex;align-items:center;gap:14px;font-size:14.5px;color:var(--ink-soft)}
  .bar-links a,.linkish{text-decoration:none;background:none;border:none;color:var(--ink-soft);cursor:pointer;transition:color .2s;font-size:14.5px}
  .bar-links a:hover,.linkish:hover{color:var(--ink)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;border:none;font-weight:600;font-size:15.5px;cursor:pointer;background:var(--brand);color:#fff;text-decoration:none;box-shadow:var(--shadow-soft);transition:transform .18s var(--ease),background .2s,box-shadow .2s}
  .btn:hover{background:var(--brand-deep);box-shadow:var(--shadow-lift)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--brand-tint);color:var(--brand);box-shadow:none}
  .btn.small{height:38px;padding:0 15px;font-size:14px}
  .btn.block{width:100%}
  .btn.danger{background:var(--danger)}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .theme-toggle{width:36px;height:36px;border-radius:999px;border:1px solid var(--hairline);background:var(--surface);color:var(--ink-soft);cursor:pointer;display:grid;place-items:center}
  .theme-toggle:hover{color:var(--ink);border-color:var(--brand)}
  .demo-tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--clay);border:1px solid var(--clay);border-radius:999px;padding:3px 9px}

  .hero{position:relative;padding:76px 0 44px;text-align:center}
  .hero .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:20px}
  .eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--brand);display:inline-flex;align-items:center;gap:8px}
  .eyebrow::before,.eyebrow::after{content:"";width:20px;height:1px;background:var(--brand);opacity:.5}
  .hero h1{font-size:clamp(36px,6vw,58px);font-weight:600;max-width:15ch}
  .hero .lede{font-size:clamp(16.5px,2.1vw,19px);color:var(--ink-soft);max-width:52ch}
  .cta-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:4px}
  .crisis-line{font-size:13px;color:var(--ink-faint);margin-top:2px}
  .crisis-line a{color:var(--brand);font-weight:600}
  .conditions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:6px}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--hairline);font-size:14px;font-weight:500;color:var(--ink);box-shadow:var(--shadow-soft);cursor:pointer;transition:transform .18s var(--ease),border-color .2s,color .2s}
  .chip .ic{color:var(--brand)}
  .chip:hover{transform:translateY(-2px);border-color:var(--brand);color:var(--brand)}
  section{padding:38px 0}
  .section-label{font-size:12.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);margin-bottom:12px}
  h2{font-size:clamp(24px,3.4vw,32px);font-weight:600}
  .card{background:var(--surface);border:1px solid var(--hairline);border-radius:22px;box-shadow:var(--shadow-lift);padding:30px;position:relative;overflow:hidden}

  .prog-head{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);margin-bottom:11px}
  .prog-head .count{font-variant-numeric:tabular-nums}
  .prog{height:6px;border-radius:999px;background:var(--hairline);overflow:hidden}
  .prog>i{display:block;height:100%;width:0;border-radius:999px;background:var(--brand);transition:width .5s var(--ease)}
  .q-help{font-size:14px;color:var(--ink-faint);margin:24px 0 6px}
  .q-prompt{font-size:clamp(20px,3vw,25px);font-weight:600;line-height:1.25;margin-bottom:20px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;min-height:56px;padding:13px 17px;border-radius:14px;cursor:pointer;background:var(--surface-2);border:1.5px solid var(--hairline);color:var(--ink);font-size:15.5px;font-weight:500;transition:transform .16s var(--ease),border-color .18s,background .18s}
  .opt:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--hairline))}
  .opt:active{transform:scale(.985)}
  .opt.sel{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-deep)}
  .opt .num{flex:none;width:25px;height:25px;border-radius:999px;display:grid;place-items:center;background:rgba(62,107,92,.1);color:var(--ink-faint);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
  .opt.sel .num{background:var(--brand);color:#fff}
  .screener-foot{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
  .link-btn{background:none;border:none;font-size:14.5px;color:var(--ink-soft);cursor:pointer;padding:8px 4px}
  .link-btn:disabled{opacity:.35;cursor:default}
  .link-btn:not(:disabled):hover{color:var(--ink)}
  .result{text-align:center;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .result h3{font-size:clamp(23px,3.4vw,29px);font-weight:600}
  .result p{color:var(--ink-soft);max-width:46ch}
  .badge{font-size:12.5px;font-weight:600;padding:5px 13px;border-radius:999px;background:var(--brand-tint);color:var(--brand)}
  .badge.warn{background:color-mix(in srgb,var(--clay) 18%,transparent);color:var(--clay)}
  .badge.pos{background:color-mix(in srgb,var(--positive) 16%,transparent);color:var(--positive)}
  .crisis{text-align:left;display:flex;flex-direction:column;gap:16px}
  .crisis h3{font-size:clamp(23px,3.6vw,31px);font-weight:600;line-height:1.18}
  .crisis p{color:var(--ink-soft)}
  .crisis-actions{display:flex;flex-direction:column;gap:11px}
  .crisis-big{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:70px;padding:15px 21px;border-radius:15px;text-decoration:none;box-shadow:var(--shadow-soft)}
  .crisis-big.a1{background:var(--brand);color:#fff}.crisis-big.a2{background:var(--surface-2);color:var(--brand);border:1.5px solid var(--brand)}
  .crisis-big .big{font-size:19px;font-weight:600}.crisis-big .sub{font-size:12.5px;opacity:.85}

  .form{display:flex;flex-direction:column;gap:14px}
  label.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
  .fld input,.fld select,.fld textarea{height:46px;border-radius:12px;border:1px solid var(--hairline);background:var(--surface);padding:0 14px;font:inherit;font-size:16px;color:var(--ink)}
  .fld textarea{height:auto;padding:12px 14px;line-height:1.5}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .checkline{display:flex;align-items:flex-start;gap:11px;font-size:14px;color:var(--ink-soft)}
  .checkline input{margin-top:3px;accent-color:var(--brand);width:16px;height:16px}
  .err{color:var(--danger);font-size:14px}.muted{color:var(--ink-soft);font-size:14px}

  .app-top{position:sticky;top:0;z-index:30;backdrop-filter:saturate(1.5) blur(18px);-webkit-backdrop-filter:saturate(1.5) blur(18px);background:var(--glass);border-bottom:1px solid var(--hairline)}
  .app-top-in{display:flex;align-items:center;justify-content:space-between;height:58px;max-width:760px;margin:0 auto;padding:0 20px}
  .bell{position:relative;width:36px;height:36px;border-radius:999px;border:1px solid var(--hairline);background:var(--surface);color:var(--ink-soft);cursor:pointer;display:grid;place-items:center}
  .bell .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:999px;background:var(--clay);border:2px solid var(--surface)}
  .notif-pop{position:absolute;right:20px;top:54px;width:300px;max-width:calc(100vw - 40px);background:var(--surface);border:1px solid var(--hairline);border-radius:16px;box-shadow:var(--shadow-lift);z-index:60;overflow:hidden}
  .notif-pop .n{padding:13px 16px;border-bottom:1px solid var(--hairline);font-size:14px}
  .notif-pop .n:last-child{border-bottom:none}
  .notif-pop .n .s{font-size:12.5px;color:var(--ink-faint);margin-top:2px}
  .tabbar{position:sticky;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--hairline);padding:6px 0 max(6px,env(safe-area-inset-bottom))}
  .tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--ink-faint);font-size:10.5px;font-weight:600;cursor:pointer;padding:8px 12px 6px;border-radius:12px;transition:color .2s}
  .tab .glyph{display:grid;place-items:center;height:23px;transition:transform .2s var(--ease)}
  .tab:active .glyph{transform:scale(.9)}
  .tab.active{color:var(--brand)}
  .tab.active .glyph{transform:translateY(-1px)}
  .tab.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
  .ic{display:block;flex:none}
  .screen{padding:24px 0 30px;animation:fade .4s var(--ease) both}
  .screen h2{font-size:27px;font-weight:700;letter-spacing:-.022em;margin-bottom:16px}
  .list-card .t{font-weight:600;font-size:16px}
  /* home hero */
  .hero-card{position:relative;overflow:hidden;border-radius:20px;padding:20px;background:linear-gradient(150deg,var(--brand),var(--brand-deep));color:#fff;box-shadow:var(--shadow-lift);margin-bottom:14px}
  .hero-card .glow{position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:999px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
  .hero-card .eyebrow2{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.82}
  .hero-card .big{font-size:20px;font-weight:600;margin:5px 0 2px;letter-spacing:-.01em}
  .hero-card .meta{display:flex;align-items:center;gap:7px;font-size:13.5px;opacity:.9;margin-top:3px}
  .hero-card .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
  .hero-card .prov{background:transparent;border:none;box-shadow:none;padding:0;flex-direction:row;align-items:center;gap:10px;cursor:default}
  .avatar-sm{width:40px;height:40px;border-radius:999px;background:linear-gradient(150deg,#7fb8a4,#3e6b5c);display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;flex:none;border:1.5px solid rgba(255,255,255,.3)}
  .avatar-sm.ink{background:linear-gradient(150deg,var(--brand),var(--brand-deep));border-color:var(--hairline)}
  .btn.on-brand{background:#fff;color:var(--brand-deep)}.btn.on-brand:hover{background:#fff;opacity:.92}
  /* empty state */
  .estate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:34px 22px}
  .estate .orb{width:72px;height:72px;border-radius:999px;background:radial-gradient(circle at 35% 30%,var(--brand-tint),color-mix(in srgb,var(--brand) 22%,transparent));display:grid;place-items:center;color:var(--brand);box-shadow:inset 0 0 0 1px var(--hairline)}
  .estate h3{font-size:18px;font-weight:600}.estate p{color:var(--ink-soft);font-size:14.5px;max-width:34ch}
  .prompts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:2px}
  .pchip{border:1px solid var(--hairline);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:13.5px;font-weight:500;color:var(--ink);cursor:pointer;transition:border-color .18s,transform .16s var(--ease)}
  .pchip:hover{border-color:var(--brand);color:var(--brand)}.pchip:active{transform:scale(.97)}
  /* progress ring */
  .ring{--p:0;width:44px;height:44px;border-radius:999px;flex:none;display:grid;place-items:center;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--hairline) 0);font-size:0}
  .ring>span{width:34px;height:34px;border-radius:999px;background:var(--surface);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
  .checkline-task{width:24px;height:24px;border-radius:999px;border:1.8px solid var(--hairline);display:grid;place-items:center;flex:none;cursor:pointer;color:transparent;transition:background .18s,border-color .18s,color .18s}
  .task.done .checkline-task{background:var(--brand);border-color:var(--brand);color:#fff}
  .stack{display:flex;flex-direction:column;gap:13px}
  .list-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--hairline);border-radius:16px;box-shadow:var(--shadow-soft);padding:17px 19px}
  .list-card .t{font-weight:600}.list-card .s{font-size:13.5px;color:var(--ink-soft)}
  .nav-card{cursor:pointer;transition:transform .18s var(--ease),box-shadow .2s}
  .nav-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
  .pill{font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--brand-tint);color:var(--brand);white-space:nowrap}
  .pill.done{background:color-mix(in srgb,var(--positive) 16%,transparent);color:var(--positive)}
  .pill.past{background:var(--hairline);color:var(--ink-faint)}
  .empty{border:1px dashed var(--hairline);border-radius:16px;padding:30px 20px;text-align:center;color:var(--ink-soft)}
  .empty .t{color:var(--ink);font-weight:600;margin-bottom:5px}
  .prov{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--hairline);border-radius:16px;box-shadow:var(--shadow-soft);padding:18px;cursor:pointer;transition:transform .18s var(--ease),box-shadow .2s,border-color .2s}
  .prov:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
  .prov.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
  .prov .nm{font-weight:600}.prov .sp{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .slot{border:1px solid var(--hairline);background:var(--surface-2);border-radius:11px;padding:10px 15px;font-size:14px;font-weight:600;cursor:pointer;color:var(--brand);transition:border-color .18s,background .18s,transform .16s var(--ease)}
  .slot:hover{border-color:var(--brand);background:var(--brand-tint)}.slot:active{transform:scale(.96)}
  .daysel{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .daysel::-webkit-scrollbar{display:none}
  .dayc{flex:none;width:60px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 0;border-radius:15px;border:1.5px solid var(--hairline);background:var(--surface);cursor:pointer;transition:border-color .18s,background .18s,transform .16s var(--ease)}
  .dayc:active{transform:scale(.96)}.dayc.on{border-color:var(--brand);background:var(--brand-tint)}
  .dayc .dow{font-size:11px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em}
  .dayc.on .dow{color:var(--brand)}
  .dayc .dnum{font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15}
  .dayc.on .dnum{color:var(--brand-deep)}.dayc .dmo{font-size:10.5px;color:var(--ink-faint)}
  .orow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hairline);font-size:14.5px}
  .orow .lbl2{color:var(--ink-soft)}.orow .amt{font-weight:600;font-variant-numeric:tabular-nums}
  .ototal{display:flex;justify-content:space-between;align-items:center;padding-top:13px;font-size:17px;font-weight:700}
  .memtoggle{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1.5px solid var(--hairline);border-radius:14px;padding:13px 15px;margin:8px 0 4px;cursor:pointer;transition:border-color .18s,background .18s}
  .memtoggle.on{border-color:var(--brand);background:var(--brand-tint)}
  .sw{width:42px;height:25px;border-radius:999px;background:var(--hairline);position:relative;flex:none;transition:background .2s}
  .memtoggle.on .sw{background:var(--brand)}
  .sw i{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:999px;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .memtoggle.on .sw i{transform:translateX(17px)}
  .paysec{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-faint);margin-top:14px;justify-content:center}
  .testhint{font-size:12px;color:var(--ink-faint);background:var(--surface-2);border:1px dashed var(--hairline);border-radius:10px;padding:9px 12px;margin-top:10px}

  .chat{display:flex;flex-direction:column;height:calc(100vh - 58px - 62px);max-height:620px}
  .chat-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 2px}
  .bub{max-width:82%;padding:11px 15px;border-radius:16px;font-size:15px;line-height:1.5;white-space:pre-wrap}
  .bub.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:5px}

      var cond="anxiety";var p=PROVIDERS.find(function(x){return x.id===a.provId;});if(p&&p.sp.length)cond=p.sp[0];
      var cp=CAREPLANS[cond]||CAREPLANS.anxiety;
      store.visits.push({id:"v"+Date.now(),provider:a.provider,date:new Date().toISOString(),plan:cp.plan,tasks:cp.tasks.map(function(t){return {t:t,done:false};})});
      persist();notify("After-visit summary ready","Your provider signed your plan — see My care.");visit.stage="summary";renderVisit();},

    sendMsg:function(e){e.preventDefault();var f=e.target,body=f.body.value.trim();if(!body)return false;store.msgs.push({from:"you",body:body,ts:Date.now()});f.body.value="";persist();var scr=document.getElementById("msgScroll");scr.insertAdjacentHTML("beforeend",'<div class="bub me">'+esc(body)+'</div>');scrollMsgs();setTimeout(function(){var reply=classify(body)==="crisis"?"I'm really glad you reached out. If you're in crisis, please call or text 988 right now — they're available 24/7. Your care team is also here for you.":"Thanks for reaching out — a member of your care team will reply within one business day. If this is urgent or you're in crisis, please call or text 988.";store.msgs.push({from:"care",body:reply,ts:Date.now()});persist();notify("New message from your care team","Tap to read");var s2=document.getElementById("msgScroll");if(s2){s2.insertAdjacentHTML("beforeend",'<div class="bub them">'+esc(reply)+'</div>');scrollMsgs();}},1100);return false;},

    fillMsg:function(btn){var i=document.getElementById("msgInput");if(i){i.value=btn.textContent;i.focus();}},
    fillComp:function(btn){var i=document.getElementById("compInput");if(i){i.value=btn.textContent;i.focus();}},
    compStart:function(){comp.started=true;comp.turns=[{who:"them",text:"Hi — I'm glad you're here. This is your space to think out loud. What's on your mind?"}];renderCompanion();},
    compSend:function(e){e.preventDefault();var f=e.target,text=f.body.value.trim();if(!text)return false;f.body.value="";comp.turns.push({who:"you",text:text});var cls=classify(text);if(cls==="crisis"){comp.crisis=true;comp.turns.push({who:"them",text:"Thank you for telling me — that took courage, and I'm staying right here with you. What you're carrying deserves real human support right now: call or text 988 any time, or text HOME to 741741. If you're in immediate danger, please call 911. I've let your care team know. I can stay with you here while you reach out."});}else if(cls==="med"){comp.turns.push({who:"them",text:"Medication questions are important — and they belong with your provider, who knows your full picture. I can't advise on prescriptions or doses. Would you like to message your care team from the Messages tab? I'm happy to keep working through what's on your mind meanwhile."});}else if(comp.crisis){comp.turns.push({who:"them",text:"I'm still right here with you. If you haven't yet, please reach out to 988 (call or text) or text HOME to 741741 — real people, any hour. Would you like me to stay with you while you do?"});}else{comp.turns.push({who:"them",text:"That sounds like a lot to hold, and it makes sense you'd feel that way. One small thing we could try: name what you're feeling in a word, and notice where it sits in your body. Want to try that, or tell me more?"});}renderCompanion();return false;},

    startCheckin:function(slug,cond){location.hash="#/checkin/"+slug+"/"+cond;},
    ciChoose:function(v){var qs=ciItems(),i=ci.idx;ci.answers[i]=v;if(i===qs.length-1&&v>0){ci.done="crisis";return ciRender();}setTimeout(function(){if(i+1<qs.length){ci.idx++;ciRender();}else{ci.done="result";ciRender();}},150);},
    ciReset:function(){ci.idx=0;ci.answers=[];ci.done=null;ciRender();},
    toggleTask:function(vi,ti){store.visits[vi].tasks[ti].done=!store.visits[vi].tasks[ti].done;persist();render();}
  };

  document.addEventListener("keydown",function(e){if(sc&&!sc.done&&location.hash.indexOf("#/screener")===0){var n=parseInt(e.key,10);if(n>=1&&n<=4)CP.scChoose(n-1);}if(ci&&!ci.done&&location.hash.indexOf("#/checkin")===0){var m=parseInt(e.key,10);if(m>=1&&m<=4)CP.ciChoose(m-1);}});

  if(!location.hash)location.hash="#/";
  render();
})();
</script>
