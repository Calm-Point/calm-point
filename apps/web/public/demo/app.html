<title>Calm Point — Mental health care that meets you where you are</title>
<meta name="description" content="The Calm Point telehealth app: check in, sign up, book and attend a video visit, message your care team, talk with an AI companion, and track your care." />

<style>
  :root{
    --paper:#f7f6f3;--surface:#fff;--surface-2:#fbfaf8;--ink:#1c1e26;--ink-soft:#565a67;--ink-faint:#8b8f9a;
    --brand:#3e6b5c;--brand-deep:#2f5347;--brand-tint:#e8f0ec;--clay:#c58a5a;--danger:#a8443b;--positive:#3d8168;
    --hairline:rgba(28,30,38,.08);--glass:rgba(255,255,255,.68);
    --shadow-soft:0 1px 2px rgba(28,30,38,.04),0 12px 32px rgba(28,30,38,.07);
    --shadow-lift:0 2px 4px rgba(28,30,38,.05),0 22px 48px rgba(28,30,38,.12);
    --sans:ui-sans-serif,-apple-system,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
    --ease:cubic-bezier(.32,.72,0,1);
  }
  @media (prefers-color-scheme:dark){:root{--paper:#0f1115;--surface:#171a21;--surface-2:#1c2029;--ink:#f2f1ec;--ink-soft:#a4a9b5;--ink-faint:#767b88;--brand:#7fb8a4;--brand-deep:#9bcbba;--brand-tint:#1e2b27;--clay:#d9a87c;--danger:#e07a70;--positive:#6fb39a;--hairline:rgba(242,241,236,.1);--glass:rgba(23,26,33,.62);--shadow-soft:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);--shadow-lift:0 2px 4px rgba(0,0,0,.5),0 22px 48px rgba(0,0,0,.6)}}
  :root[data-theme="light"]{--paper:#f7f6f3;--surface:#fff;--surface-2:#fbfaf8;--ink:#1c1e26;--ink-soft:#565a67;--ink-faint:#8b8f9a;--brand:#3e6b5c;--brand-deep:#2f5347;--brand-tint:#e8f0ec;--clay:#c58a5a;--danger:#a8443b;--positive:#3d8168;--hairline:rgba(28,30,38,.08);--glass:rgba(255,255,255,.68);--shadow-soft:0 1px 2px rgba(28,30,38,.04),0 12px 32px rgba(28,30,38,.07);--shadow-lift:0 2px 4px rgba(28,30,38,.05),0 22px 48px rgba(28,30,38,.12)}
  :root[data-theme="dark"]{--paper:#0f1115;--surface:#171a21;--surface-2:#1c2029;--ink:#f2f1ec;--ink-soft:#a4a9b5;--ink-faint:#767b88;--brand:#7fb8a4;--brand-deep:#9bcbba;--brand-tint:#1e2b27;--clay:#d9a87c;--danger:#e07a70;--positive:#6fb39a;--hairline:rgba(242,241,236,.1);--glass:rgba(23,26,33,.62);--shadow-soft:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);--shadow-lift:0 2px 4px rgba(0,0,0,.5),0 22px 48px rgba(0,0,0,.6)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.02em;line-height:1.15}
  p{margin:0}a{color:inherit}button{font:inherit}
  .wrap{width:100%;max-width:940px;margin:0 auto;padding:0 22px}
  .app-wrap{width:100%;max-width:760px;margin:0 auto;padding:0 20px}
  .field{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
  .field canvas{width:100%;height:100%;display:block}

  header.bar{position:sticky;top:0;z-index:40;backdrop-filter:saturate(1.5) blur(20px);-webkit-backdrop-filter:saturate(1.5) blur(20px);background:var(--glass);border-bottom:1px solid var(--hairline)}
  .bar-in{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;cursor:pointer}
  .mark{width:25px;height:25px}
  .bar-links{display:flex;align-items:center;gap:14px;font-size:14.5px;color:var(--ink-soft)}
  .bar-links a,.linkish{text-decoration:none;background:none;border:none;color:var(--ink-soft);cursor:pointer;transition:color .2s;font-size:14.5px}
  .bar-links a:hover,.linkish:hover{color:var(--ink)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;border:none;font-weight:600;font-size:15.5px;cursor:pointer;background:var(--brand);color:#fff;text-decoration:none;box-shadow:var(--shadow-soft);transition:transform .18s var(--ease),background .2s,box-shadow .2s}
  .btn:hover{background:var(--brand-deep);box-shadow:var(--shadow-lift)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--brand-tint);color:var(--brand);box-shadow:none}
  .btn.small{height:38px;padding:0 15px;font-size:14px}
  .btn.block{width:100%}
  .btn.danger{background:var(--danger)}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .theme-toggle{width:36px;height:36px;border-radius:999px;border:1px solid var(--hairline);background:var(--surface);color:var(--ink-soft);cursor:pointer;display:grid;place-items:center}
  .theme-toggle:hover{color:var(--ink);border-color:var(--brand)}
  .demo-tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--clay);border:1px solid var(--clay);border-radius:999px;padding:3px 9px}

  .hero{position:relative;padding:76px 0 44px;text-align:center}
  .hero .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:20px}
  .eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--brand);display:inline-flex;align-items:center;gap:8px}
  .eyebrow::before,.eyebrow::after{content:"";width:20px;height:1px;background:var(--brand);opacity:.5}
  .hero h1{font-size:clamp(36px,6vw,58px);font-weight:600;max-width:15ch}
  .hero .lede{font-size:clamp(16.5px,2.1vw,19px);color:var(--ink-soft);max-width:52ch}
  .cta-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:4px}
  .crisis-line{font-size:13px;color:var(--ink-faint);margin-top:2px}
  .crisis-line a{color:var(--brand);font-weight:600}
  .conditions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:6px}
  .chip{padding:9px 15px;border-radius:999px;background:var(--surface);border:1px solid var(--hairline);font-size:14px;font-weight:500;color:var(--ink);box-shadow:var(--shadow-soft);cursor:pointer;transition:transform .18s var(--ease),border-color .2s,color .2s}
  .chip:hover{transform:translateY(-2px);border-color:var(--brand);color:var(--brand)}
  section{padding:38px 0}
  .section-label{font-size:12.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);margin-bottom:12px}
  h2{font-size:clamp(24px,3.4vw,32px);font-weight:600}
  .card{background:var(--surface);border:1px solid var(--hairline);border-radius:22px;box-shadow:var(--shadow-lift);padding:30px;position:relative;overflow:hidden}

  .prog-head{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);margin-bottom:11px}
  .prog-head .count{font-variant-numeric:tabular-nums}
  .prog{height:6px;border-radius:999px;background:var(--hairline);overflow:hidden}
  .prog>i{display:block;height:100%;width:0;border-radius:999px;background:var(--brand);transition:width .5s var(--ease)}
  .q-help{font-size:14px;color:var(--ink-faint);margin:24px 0 6px}
  .q-prompt{font-size:clamp(20px,3vw,25px);font-weight:600;line-height:1.25;margin-bottom:20px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;min-height:56px;padding:13px 17px;border-radius:14px;cursor:pointer;background:var(--surface-2);border:1.5px solid var(--hairline);color:var(--ink);font-size:15.5px;font-weight:500;transition:transform .16s var(--ease),border-color .18s,background .18s}
  .opt:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--hairline))}
  .opt:active{transform:scale(.985)}
  .opt.sel{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-deep)}
  .opt .num{flex:none;width:25px;height:25px;border-radius:999px;display:grid;place-items:center;background:rgba(62,107,92,.1);color:var(--ink-faint);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
  .opt.sel .num{background:var(--brand);color:#fff}
  .screener-foot{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
  .link-btn{background:none;border:none;font-size:14.5px;color:var(--ink-soft);cursor:pointer;padding:8px 4px}
  .link-btn:disabled{opacity:.35;cursor:default}
  .link-btn:not(:disabled):hover{color:var(--ink)}
  .result{text-align:center;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .result h3{font-size:clamp(23px,3.4vw,29px);font-weight:600}
  .result p{color:var(--ink-soft);max-width:46ch}
  .badge{font-size:12.5px;font-weight:600;padding:5px 13px;border-radius:999px;background:var(--brand-tint);color:var(--brand)}
  .badge.warn{background:color-mix(in srgb,var(--clay) 18%,transparent);color:var(--clay)}
  .badge.pos{background:color-mix(in srgb,var(--positive) 16%,transparent);color:var(--positive)}
  .crisis{text-align:left;display:flex;flex-direction:column;gap:16px}
  .crisis h3{font-size:clamp(23px,3.6vw,31px);font-weight:600;line-height:1.18}
  .crisis p{color:var(--ink-soft)}
  .crisis-actions{display:flex;flex-direction:column;gap:11px}
  .crisis-big{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:70px;padding:15px 21px;border-radius:15px;text-decoration:none;box-shadow:var(--shadow-soft)}
  .crisis-big.a1{background:var(--brand);color:#fff}.crisis-big.a2{background:var(--surface-2);color:var(--brand);border:1.5px solid var(--brand)}
  .crisis-big .big{font-size:19px;font-weight:600}.crisis-big .sub{font-size:12.5px;opacity:.85}

  .form{display:flex;flex-direction:column;gap:14px}
  label.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
  .fld input,.fld select,.fld textarea{height:46px;border-radius:12px;border:1px solid var(--hairline);background:var(--surface);padding:0 14px;font:inherit;font-size:16px;color:var(--ink)}
  .fld textarea{height:auto;padding:12px 14px;line-height:1.5}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .checkline{display:flex;align-items:flex-start;gap:11px;font-size:14px;color:var(--ink-soft)}
  .checkline input{margin-top:3px;accent-color:var(--brand);width:16px;height:16px}
  .err{color:var(--danger);font-size:14px}.muted{color:var(--ink-soft);font-size:14px}

  .app-top{position:sticky;top:0;z-index:30;backdrop-filter:saturate(1.5) blur(18px);-webkit-backdrop-filter:saturate(1.5) blur(18px);background:var(--glass);border-bottom:1px solid var(--hairline)}
  .app-top-in{display:flex;align-items:center;justify-content:space-between;height:58px;max-width:760px;margin:0 auto;padding:0 20px}
  .bell{position:relative;width:36px;height:36px;border-radius:999px;border:1px solid var(--hairline);background:var(--surface);color:var(--ink-soft);cursor:pointer;display:grid;place-items:center}
  .bell .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:999px;background:var(--clay);border:2px solid var(--surface)}
  .notif-pop{position:absolute;right:20px;top:54px;width:300px;max-width:calc(100vw - 40px);background:var(--surface);border:1px solid var(--hairline);border-radius:16px;box-shadow:var(--shadow-lift);z-index:60;overflow:hidden}
  .notif-pop .n{padding:13px 16px;border-bottom:1px solid var(--hairline);font-size:14px}
  .notif-pop .n:last-child{border-bottom:none}
  .notif-pop .n .s{font-size:12.5px;color:var(--ink-faint);margin-top:2px}
  .tabbar{position:sticky;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--hairline);padding:6px 0 max(6px,env(safe-area-inset-bottom))}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--ink-faint);font-size:11px;font-weight:600;cursor:pointer;padding:6px 12px;border-radius:12px}
  .tab .glyph{font-size:19px;line-height:1}.tab.active{color:var(--brand)}
  .screen{padding:24px 0 30px;animation:fade .4s var(--ease) both}
  .screen h2{margin-bottom:16px}
  .stack{display:flex;flex-direction:column;gap:13px}
  .list-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--hairline);border-radius:16px;box-shadow:var(--shadow-soft);padding:17px 19px}
  .list-card .t{font-weight:600}.list-card .s{font-size:13.5px;color:var(--ink-soft)}
  .nav-card{cursor:pointer;transition:transform .18s var(--ease),box-shadow .2s}
  .nav-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
  .pill{font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--brand-tint);color:var(--brand);white-space:nowrap}
  .pill.done{background:color-mix(in srgb,var(--positive) 16%,transparent);color:var(--positive)}
  .pill.past{background:var(--hairline);color:var(--ink-faint)}
  .empty{border:1px dashed var(--hairline);border-radius:16px;padding:30px 20px;text-align:center;color:var(--ink-soft)}
  .empty .t{color:var(--ink);font-weight:600;margin-bottom:5px}
  .prov{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--hairline);border-radius:16px;box-shadow:var(--shadow-soft);padding:18px;cursor:pointer;transition:transform .18s var(--ease),box-shadow .2s,border-color .2s}
  .prov:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
  .prov.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
  .prov .nm{font-weight:600}.prov .sp{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .slot{border:1px solid var(--hairline);background:var(--surface-2);border-radius:11px;padding:9px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--brand);transition:border-color .18s,transform .16s var(--ease)}
  .slot:hover{border-color:var(--brand)}.slot:active{transform:scale(.96)}

  .chat{display:flex;flex-direction:column;height:calc(100vh - 58px - 62px);max-height:620px}
  .chat-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 2px}
  .bub{max-width:82%;padding:11px 15px;border-radius:16px;font-size:15px;line-height:1.5;white-space:pre-wrap}
  .bub.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:5px}
  .bub.them{align-self:flex-start;background:var(--surface);border:1px solid var(--hairline);border-bottom-left-radius:5px}
  .composer{display:flex;gap:9px;padding-top:10px}
  .composer input{flex:1;height:46px;border-radius:999px;border:1px solid var(--hairline);background:var(--surface);padding:0 17px;font:inherit;font-size:15.5px;color:var(--ink)}
  .banner{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:600;margin-bottom:10px}
  .banner.ok{background:var(--brand-tint);color:var(--brand)}
  .banner.crisis{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
  .banner a{color:inherit;text-decoration:underline}
  .trend{display:flex;align-items:flex-end;gap:5px;height:56px;margin:4px 0 8px}
  .trend i{flex:1;min-width:5px;border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--brand) 70%,transparent)}

  /* visit room */
  .stage{border-radius:20px;overflow:hidden;position:relative;background:linear-gradient(160deg,#20323c,#12202a);min-height:300px;display:grid;place-items:center;box-shadow:var(--shadow-lift)}
  .stage .self{position:absolute;bottom:14px;right:14px;width:88px;height:112px;border-radius:12px;background:linear-gradient(160deg,#2f5347,#233f37);border:1.5px solid rgba(255,255,255,.2);display:grid;place-items:center;color:rgba(255,255,255,.65);font-size:12px}
  .stage .who{color:rgba(255,255,255,.9);text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
  .stage .avatar{width:74px;height:74px;border-radius:999px;background:rgba(127,184,164,.25);display:grid;place-items:center;font-size:26px;color:#cfe6dc}
  .stage .live{position:absolute;top:14px;left:14px;font-size:12px;font-weight:600;color:#fff;background:rgba(180,72,62,.9);padding:4px 11px;border-radius:999px;display:flex;align-items:center;gap:6px}
  .stage .live i{width:7px;height:7px;border-radius:999px;background:#fff;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .vctl{display:flex;gap:10px;justify-content:center;margin-top:16px}
  .vbtn{width:52px;height:52px;border-radius:999px;border:1px solid var(--hairline);background:var(--surface);color:var(--ink);font-size:19px;cursor:pointer;display:grid;place-items:center;transition:transform .16s var(--ease),background .2s}
  .vbtn:active{transform:scale(.94)}.vbtn.off{background:var(--danger);color:#fff;border-color:transparent}
  .vbtn.leave{background:var(--danger);color:#fff;border-color:transparent;width:auto;padding:0 22px;border-radius:999px;font-weight:600;font-size:14.5px;gap:8px}
  .scribe{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--hairline);border-radius:14px;padding:14px 16px;margin-top:16px;background:var(--surface)}

  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lift);z-index:80;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .steps{display:grid;gap:13px;grid-template-columns:repeat(3,1fr)}
  @media (max-width:720px){.steps{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
  .step{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;padding:22px;box-shadow:var(--shadow-soft)}
  .step .n{width:29px;height:29px;border-radius:999px;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;font-weight:600;font-size:14px;margin-bottom:12px;font-variant-numeric:tabular-nums}
  .step h3{font-size:17px;font-weight:600;margin-bottom:5px}.step p{font-size:14px;color:var(--ink-soft);line-height:1.55}
  .plan{border:1.5px solid var(--hairline);border-radius:18px;padding:22px;background:var(--surface);box-shadow:var(--shadow-soft);cursor:pointer;transition:border-color .2s,transform .18s var(--ease)}
  .plan:hover{transform:translateY(-2px)}.plan.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
  .plan .price{font-size:32px;font-weight:600;letter-spacing:-.02em}
  .plan ul{margin:12px 0 0;padding-left:18px;color:var(--ink-soft);font-size:14px;line-height:1.7}
  .task{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--surface);border:1px solid var(--hairline);border-radius:14px}
  .task input{width:18px;height:18px;accent-color:var(--brand)}
  .task.done label{text-decoration:line-through;color:var(--ink-faint)}
  footer{border-top:1px solid var(--hairline);padding:30px 0 44px;margin-top:24px;color:var(--ink-faint);font-size:13px;text-align:center}
  footer a{color:var(--brand);text-decoration:none}
  .disclaimer{max-width:62ch;margin:0 auto 12px;line-height:1.55}
  .fade{animation:fade .4s var(--ease) both}
  @keyframes fade{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade,.screen{animation:none}.prog>i{transition:none}.stage .live i{animation:none}}
  @media (max-width:560px){.bar-links .nav-link{display:none}}
</style>

<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  var root=document.getElementById("root"),rootEl=document.documentElement;
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];});};

  /* ---------- persistence ---------- */
  var DB={load:function(){try{return JSON.parse(localStorage.getItem("cp_demo2")||"{}");}catch(e){return{};}},save:function(d){try{localStorage.setItem("cp_demo2",JSON.stringify(d));}catch(e){}}};
  var store=DB.load();
  store.users=store.users||{};
  store.appts=store.appts||[];       // {id,provId,provider,startsAt,kind,status}
  store.visits=store.visits||[];     // completed: {id,provider,date,plan,tasks:[{t,done}]}
  store.msgs=store.msgs||[];

    var a=store.appts.find(function(x){return x.id===visit.id;});
    if(visit.stage==="prejoin"){
      el.innerHTML='<div class="card"><h2 style="margin-bottom:4px">Ready for your visit?</h2><p class="muted" style="margin-bottom:18px">Find a quiet, private space. Check your camera and microphone, then join.</p><div class="stage" style="min-height:200px"><div class="who"><div class="avatar">🙂</div><div style="font-size:13px;opacity:.8">Camera preview</div></div></div><div class="vctl"><button class="vbtn'+(visit.cam?"":" off")+'" onclick="CP.vToggle(\'cam\')" title="Camera">'+(visit.cam?"📷":"🚫")+'</button><button class="vbtn'+(visit.mic?"":" off")+'" onclick="CP.vToggle(\'mic\')" title="Mic">'+(visit.mic?"🎙️":"🔇")+'</button></div><button class="btn block" style="margin-top:18px" onclick="CP.vJoin()">Join visit with '+esc(a.provider)+'</button></div>';
    } else if(visit.stage==="inroom"){
      var mm=String(Math.floor(visit.secs/60)).padStart(2,"0"),ss=String(visit.secs%60).padStart(2,"0");
      el.innerHTML='<div class="card"><div class="stage"><div class="live"><i></i>Live · '+mm+':'+ss+'</div><div class="who"><div class="avatar">👩‍⚕️</div><div style="font-weight:600">'+esc(a.provider)+'</div><div style="font-size:12.5px;opacity:.75">Connected</div></div><div class="self">You</div></div>'+
        '<div class="vctl"><button class="vbtn'+(visit.mic?"":" off")+'" onclick="CP.vToggle(\'mic\')">'+(visit.mic?"🎙️":"🔇")+'</button><button class="vbtn'+(visit.cam?"":" off")+'" onclick="CP.vToggle(\'cam\')">'+(visit.cam?"📷":"🚫")+'</button><button class="vbtn leave" onclick="CP.vEnd()">End visit</button></div>'+
        '<div class="scribe"><div><div style="font-weight:600;font-size:14.5px">AI visit notes</div><div class="muted" style="font-size:13px">'+(visit.consent?"On — your provider will review and sign the draft.":"With everyone's consent, we can draft notes so your provider focuses on you.")+'</div></div>'+(visit.consent?'<span class="pill done">consented</span>':'<button class="btn small ghost" onclick="CP.vConsent()">I consent</button>')+'</div></div>';
    } else if(visit.stage==="summary"){
      el.innerHTML='<div class="card result fade"><span class="badge pos">Visit complete</span><h3>Nice work showing up for yourself.</h3><p>Your provider signed an after-visit summary and a care plan. You\'ll find it any time under <b>My care</b>.</p><a class="btn" href="#/care">View my care plan</a></div>';
    }
  }

  /* ---------- messages ---------- */
  function messages(){
    var body='<section class="screen"><h2>Messages</h2>'+(store.appts.length?"":'<p class="muted" style="margin-bottom:12px">Book a visit and your care team appears here. You can still say hello below.</p>')+'<div class="banner ok"><span>Secure · private to you and your care team</span></div><div class="chat"><div class="chat-scroll" id="msgScroll">'+(store.msgs.length?store.msgs.map(function(m){return '<div class="bub '+(m.from==="you"?"me":"them")+'">'+esc(m.body)+'</div>';}).join(""):'<p class="muted">Say hello — your care team replies here.</p>')+'</div><form class="composer" onsubmit="return CP.sendMsg(event)"><input name="body" placeholder="Write a message…" autocomplete="off" required><button class="btn small" type="submit">Send</button></form></div></section>';
    setTimeout(scrollMsgs,0);return shell("messages",body);
  }
  function scrollMsgs(){var s=document.getElementById("msgScroll");if(s)s.scrollTop=s.scrollHeight;}

  /* ---------- companion ---------- */
  var comp={started:false,crisis:false,turns:[]};
  function companion(){var body='<section class="screen"><h2>Companion</h2><div id="compBody"></div></section>';setTimeout(renderCompanion,0);return shell("companion",body);}
  function renderCompanion(){var el=document.getElementById("compBody");if(!el)return;if(!comp.started){el.innerHTML='<div class="card"><h3 style="font-size:20px;margin-bottom:12px">Before we start</h3><p class="muted" style="line-height:1.7;margin-bottom:18px">• I\'m an AI companion, not a therapist or doctor — no diagnosis, no medication advice.<br>• I\'m not for emergencies. In crisis, call or text 988 any time.<br>• What we talk about is private to your account.</p><button class="btn block" onclick="CP.compStart()">I understand — let\'s talk</button></div>';return;}el.innerHTML='<div class="banner '+(comp.crisis?"crisis":"ok")+'"><span>'+(comp.crisis?"Support resources active — you're not alone":"AI companion · not a clinician · not for emergencies")+'</span><a href="tel:988">Crisis? 988</a></div><div class="chat"><div class="chat-scroll" id="compScroll">'+comp.turns.map(function(t){return '<div class="bub '+(t.who==="you"?"me":"them")+'">'+esc(t.text)+'</div>';}).join("")+'</div><form class="composer" onsubmit="return CP.compSend(event)"><input name="body" placeholder="Say what\'s true for you right now…" autocomplete="off" required><button class="btn small" type="submit">Send</button></form></div>';var s=document.getElementById("compScroll");if(s)s.scrollTop=s.scrollHeight;}

  /* ---------- care: visit summaries + plan tasks + check-ins + settings ---------- */
  function care(){
    var slugs=[["gad-7","GAD-7","anxiety"],["phq-9","PHQ-9","depression"]];
    var body='<section class="screen"><h2>My care</h2>';
    // care plan tasks
    var tasks=[];store.visits.forEach(function(v,vi){(v.tasks||[]).forEach(function(t,ti){tasks.push({vi:vi,ti:ti,t:t.t,done:t.done});});});
    if(tasks.length){body+='<div class="section-label">Your care plan</div><div class="stack" style="margin-bottom:22px">'+tasks.map(function(t){return '<div class="task '+(t.done?"done":"")+'"><input type="checkbox" '+(t.done?"checked":"")+' onchange="CP.toggleTask('+t.vi+','+t.ti+')" id="tk'+t.vi+'_'+t.ti+'"><label for="tk'+t.vi+'_'+t.ti+'">'+esc(t.t)+'</label></div>';}).join("")+'</div>';}
    // check-ins
    body+='<div class="section-label">Check-ins</div><div class="stack">'+slugs.map(function(row){var slug=row[0],hist=store.checkins[slug]||[];var due=!hist.length||(Date.now()-hist[hist.length-1].ts>12096e5);var trend=hist.length?'<div class="trend">'+hist.map(function(h){var mx=Math.max.apply(null,hist.map(function(x){return x.score;}).concat([1]));return '<i style="height:'+Math.max(8,h.score/mx*56)+'px" title="'+h.score+'"></i>';}).join("")+'</div><div class="s" style="font-size:13.5px;color:var(--ink-soft)">Latest: <b style="color:var(--ink)">'+hist[hist.length-1].score+'</b> · '+hist[hist.length-1].sev+'</div>':'<div class="s" style="font-size:13.5px;color:var(--ink-soft)">Your first check-in starts a trend your provider can follow.</div>';return '<div class="list-card" style="flex-direction:column;align-items:stretch;gap:10px"><div style="display:flex;justify-content:space-between;align-items:center"><div class="t">'+row[1]+'</div>'+(due?'<button class="btn small" onclick="CP.startCheckin(\''+slug+'\',\''+row[2]+'\')">Check in now</button>':'<span class="pill done">up to date</span>')+'</div>'+trend+'</div>';}).join("")+'</div>';
    // visit summaries
    body+='<div class="section-label" style="margin-top:24px">Visit summaries</div>'+(store.visits.length?'<div class="stack">'+store.visits.slice().reverse().map(function(v){return '<div class="list-card" style="flex-direction:column;align-items:stretch;gap:6px"><div class="t">'+fmtDay(v.date)+'</div><div class="s">with '+esc(v.provider)+'</div><div class="section-label" style="margin:8px 0 2px">Your plan</div><p style="font-size:14.5px;line-height:1.55">'+esc(v.plan)+'</p></div>';}).join("")+'</div>':'<div class="empty"><div class="t">Your visit summaries will appear here</div>After each visit, your provider signs a summary of your plan.</div>');
    // settings
    var p=prof()||{};
    body+='<div class="section-label" style="margin-top:24px">Profile &amp; settings</div><div class="card" style="border-radius:16px;box-shadow:var(--shadow-soft);padding:20px"><form class="form" onsubmit="return CP.saveSettings(event)"><div class="row2"><label class="fld">State<select name="state">'+STATES.map(function(s){return '<option'+(p.state===s?" selected":"")+'>'+s+'</option>';}).join("")+'</select></label><label class="fld">Emergency contact<input name="ec" value="'+esc(p.ec||"")+'"></label></div><label class="checkline"><input type="checkbox" '+(p.reminders!==false?"checked":"")+' name="reminders"> Send me appointment reminders (email/SMS)</label><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn small" type="submit">Save changes</button><button class="linkish" type="button" style="color:var(--danger)" onclick="CP.signout()">Sign out</button></div></form></div>';
    body+='</section>';
    return shell("care",body);
  }
  var ci=null;
  function checkinScreen(slug,cond){ci={slug:slug,cond:cond,idx:0,answers:[],done:null};var body='<section class="screen"><button class="link-btn" onclick="location.hash=\'#/care\'">← My care</button><div class="card" id="ciCard" style="margin-top:10px"></div></section>';setTimeout(ciRender,0);return shell("care",body);}
  function ciItems(){return QSET[ci.cond].items.concat([SAFETY]);}
  function ciRender(){var c=document.getElementById("ciCard");if(!c)return;if(ci.done==="crisis")return crisisInto(c,"CP.ciReset()");if(ci.done==="result"){ciSave();c.innerHTML='<div class="result fade"><span class="badge pos">Recorded</span><h3>Thanks for checking in.</h3><p>Your provider will see this, and it\'s now part of your trend.</p><a class="btn" href="#/care">Back to my care</a></div>';return;}var qs=ciItems(),total=qs.length,i=ci.idx,isSafety=i===total-1,pct=Math.round(i/total*100);c.innerHTML='<div class="prog-head"><span>'+QSET[ci.cond].label+' check-in</span><span class="count">'+(i+1)+' of '+total+'</span></div><div class="prog"><i style="width:'+pct+'%"></i></div><div class="fade"><p class="q-help">'+(isSafety?"One more — this one matters to us.":esc(QSET[ci.cond].help))+'</p><p class="q-prompt">'+esc(qs[i])+'</p><div class="opts">'+OPTS4.map(function(o,oi){var s=ci.answers[i]===oi?" sel":"";return '<button class="opt'+s+'" onclick="CP.ciChoose('+oi+')"><span class="num">'+(oi+1)+'</span>'+o+'</button>';}).join("")+'</div></div>';}
  function ciSave(){var clin=ci.answers.slice(0,ciItems().length-1),s=clin.reduce(function(a,b){return a+(b||0);},0);var sev=s<=2?"minimal":s<=5?"mild":"moderate";store.checkins[ci.slug]=(store.checkins[ci.slug]||[]).concat([{ts:Date.now(),score:s,sev:sev}]);persist();}

  /* ================= dispatch ================= */
  function render(){
    var h=location.hash||"#/";var parts=h.replace(/^#\//,"").split("/");var route=parts[0]||"";
    var authed=!!me();var appRoutes=["app","appointments","messages","companion","care","onboarding","visit","checkin"];
    if(appRoutes.indexOf(route)>=0&&!authed){location.hash="#/login";return;}
    notifOpen=false;
    var html;
    if(route==="")html=landing();
    else if(route==="screener")html=screener(parts[1]);
    else if(route==="signup")html=authed?goHome():signup();
    else if(route==="login")html=authed?goHome():login();
    else if(route==="onboarding")html=onboarding();
    else if(route==="app")html=home();
    else if(route==="appointments")html=appointments();
    else if(route==="visit")html=visitRoom(parts[1]);
    else if(route==="messages")html=messages();
    else if(route==="companion")html=companion();
    else if(route==="care")html=care();
    else if(route==="checkin")html=checkinScreen(parts[1],parts[2]);
    else html=landing();
    root.innerHTML=html;window.scrollTo(0,0);
    if(route==="")startField();
    if(route==="screener")scRender();
    // mark notifs read when opening app home
    if(route==="app"){store.notifs.forEach(function(n){n.read=true;});persist();}
  }
  function goHome(){location.hash="#/app";return "";}

  var fieldRAF;
  function startField(){var cv=document.getElementById("fieldCanvas");if(!cv)return;var ctx=cv.getContext("2d"),t=0,DPR=Math.min(2,window.devicePixelRatio||1);var blobs=[];for(var i=0;i<5;i++)blobs.push({x:Math.random(),y:Math.random(),r:.28+Math.random()*.22,p:Math.random()*6.28,s:.4+Math.random()*.5});function col(){return getComputedStyle(rootEl).getPropertyValue("--brand").trim()||"#3e6b5c";}function hexA(hex,a){hex=hex.replace("#","");if(hex.length===3)hex=hex.split("").map(function(c){return c+c;}).join("");var n=parseInt(hex,16);return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";}function draw(){cv.width=cv.clientWidth*DPR;cv.height=cv.clientHeight*DPR;var w=cv.width,hh=cv.height;ctx.clearRect(0,0,w,hh);var cc=col();for(var i=0;i<blobs.length;i++){var b=blobs[i],br=reduce?1:1+Math.sin(t*6e-4*b.s+b.p)*.12,cx=b.x*w,cy=b.y*hh*.9,rad=b.r*Math.min(w,hh)*br,g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);g.addColorStop(0,hexA(cc,.1));g.addColorStop(1,hexA(cc,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,rad,0,6.2832);ctx.fill();}if(!reduce){t+=16;fieldRAF=requestAnimationFrame(draw);}}cancelAnimationFrame(fieldRAF);draw();}

  /* ================= actions ================= */
  window.CP={
    toggleTheme:function(){var cur=rootEl.getAttribute("data-theme")||(window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");rootEl.setAttribute("data-theme",cur==="dark"?"light":"dark");},
    signout:function(){store.session=null;persist();location.hash="#/";},
    toggleNotifs:function(e){e.stopPropagation();notifOpen=!notifOpen;render();if(notifOpen){setTimeout(function(){document.addEventListener("click",function h(){notifOpen=false;document.removeEventListener("click",h);render();},{once:true});},0);}},

    scChoose:function(v){var qs=scItems(),i=sc.idx;sc.answers[i]=v;if(i===qs.length-1&&v>0){sc.done="crisis";return scRender();}setTimeout(function(){if(i+1<qs.length){sc.idx++;scRender();}else{sc.done="result";scRender();}},150);},
    scBack:function(){if(sc.idx>0){sc.idx--;scRender();}},
    scReset:function(){sc.idx=0;sc.answers=[];sc.done=null;scRender();},

    doSignup:function(e){e.preventDefault();var f=e.target,email=f.email.value.trim().toLowerCase();if(store.users[email]){document.getElementById("suErr").textContent="That email already has an account. Try signing in.";return false;}store.users[email]={name:f.first.value.trim()+" "+f.last.value.trim(),pw:f.pw.value,profile:null};store.session=email;persist();toast("Welcome to Calm Point");location.hash="#/onboarding";return false;},
    doLogin:function(e){e.preventDefault();var f=e.target,email=f.email.value.trim().toLowerCase(),u=store.users[email];if(!u||u.pw!==f.pw.value){document.getElementById("liErr").textContent="That email and password didn't match.";return false;}store.session=email;persist();location.hash="#/app";return false;},
    doOnboard:function(e){e.preventDefault();var f=e.target;me().profile={dob:f.dob.value,state:f.state.value,ec:f.ec.value.trim(),ecp:f.ecp.value.trim(),pharm:f.pharm.value.trim(),reminders:true};persist();toast("You're all set");location.hash="#/appointments";return false;},
    saveSettings:function(e){e.preventDefault();var f=e.target,p=prof();p.state=f.state.value;p.ec=f.ec.value.trim();p.reminders=f.reminders.checked;persist();toast("Changes saved");render();return false;},

    pickProvider:function(id){booking={prov:id};renderProviders();var sa=document.getElementById("slotArea");if(sa)sa.scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"});},
    startReschedule:function(id){rescheduleId=id;booking=null;toast("Pick a new time below");render();var el=document.querySelector('.section-label');},
    book:function(iso){var p=PROVIDERS.find(function(x){return x.id===booking.prov;});
      if(rescheduleId){var a=store.appts.find(function(x){return x.id===rescheduleId;});a.startsAt=iso;a.provId=p.id;a.provider=p.name;rescheduleId=null;booking=null;persist();notify("Visit rescheduled",fmtDate(iso)+" with "+p.name);toast("Visit rescheduled");render();return;}
      var appt={id:"a"+Date.now(),provId:p.id,provider:p.name,startsAt:iso,kind:"First visit",status:"scheduled"};store.appts.push(appt);persist();booking=null;notify("Visit booked",fmtDate(iso)+" with "+p.name);toast("Booked! You'll get a reminder before your visit.");render();},
    cancelAppt:function(id){var a=store.appts.find(function(x){return x.id===id;});a.status="cancelled";persist();toast("Visit cancelled");render();},

    goVisit:function(id){location.hash="#/visit/"+id;},
    vToggle:function(k){visit[k]=!visit[k];renderVisit();},
    vConsent:function(){visit.consent=true;toast("Consent recorded — thank you");renderVisit();},
    vJoin:function(){var a=store.appts.find(function(x){return x.id===visit.id;});a.status="in_progress";persist();visit.stage="inroom";visit.secs=0;renderVisit();visit.timer=setInterval(function(){visit.secs++;var mm=String(Math.floor(visit.secs/60)).padStart(2,"0"),ss=String(visit.secs%60).padStart(2,"0");var live=document.querySelector(".live");if(live)live.innerHTML='<i></i>Live · '+mm+':'+ss;},1000);},
    vEnd:function(){clearInterval(visit.timer);var a=store.appts.find(function(x){return x.id===visit.id;});a.status="completed";
      // build a care plan from the provider's specialty ∩ patient condition (demo: use first matching)
      var cond="anxiety";var p=PROVIDERS.find(function(x){return x.id===a.provId;});if(p&&p.sp.length)cond=p.sp[0];
      var cp=CAREPLANS[cond]||CAREPLANS.anxiety;
      store.visits.push({id:"v"+Date.now(),provider:a.provider,date:new Date().toISOString(),plan:cp.plan,tasks:cp.tasks.map(function(t){return {t:t,done:false};})});
      persist();notify("After-visit summary ready","Your provider signed your plan — see My care.");visit.stage="summary";renderVisit();},

    sendMsg:function(e){e.preventDefault();var f=e.target,body=f.body.value.trim();if(!body)return false;store.msgs.push({from:"you",body:body,ts:Date.now()});f.body.value="";persist();var scr=document.getElementById("msgScroll");scr.insertAdjacentHTML("beforeend",'<div class="bub me">'+esc(body)+'</div>');scrollMsgs();setTimeout(function(){var reply=classify(body)==="crisis"?"I'm really glad you reached out. If you're in crisis, please call or text 988 right now — they're available 24/7. Your care team is also here for you.":"Thanks for reaching out — a member of your care team will reply within one business day. If this is urgent or you're in crisis, please call or text 988.";store.msgs.push({from:"care",body:reply,ts:Date.now()});persist();notify("New message from your care team","Tap to read");var s2=document.getElementById("msgScroll");if(s2){s2.insertAdjacentHTML("beforeend",'<div class="bub them">'+esc(reply)+'</div>');scrollMsgs();}},1100);return false;},

    compStart:function(){comp.started=true;comp.turns=[{who:"them",text:"Hi — I'm glad you're here. This is your space to think out loud. What's on your mind?"}];renderCompanion();},
    compSend:function(e){e.preventDefault();var f=e.target,text=f.body.value.trim();if(!text)return false;f.body.value="";comp.turns.push({who:"you",text:text});var cls=classify(text);if(cls==="crisis"){comp.crisis=true;comp.turns.push({who:"them",text:"Thank you for telling me — that took courage, and I'm staying right here with you. What you're carrying deserves real human support right now: call or text 988 any time, or text HOME to 741741. If you're in immediate danger, please call 911. I've let your care team know. I can stay with you here while you reach out."});}else if(cls==="med"){comp.turns.push({who:"them",text:"Medication questions are important — and they belong with your provider, who knows your full picture. I can't advise on prescriptions or doses. Would you like to message your care team from the Messages tab? I'm happy to keep working through what's on your mind meanwhile."});}else if(comp.crisis){comp.turns.push({who:"them",text:"I'm still right here with you. If you haven't yet, please reach out to 988 (call or text) or text HOME to 741741 — real people, any hour. Would you like me to stay with you while you do?"});}else{comp.turns.push({who:"them",text:"That sounds like a lot to hold, and it makes sense you'd feel that way. One small thing we could try: name what you're feeling in a word, and notice where it sits in your body. Want to try that, or tell me more?"});}renderCompanion();return false;},

    startCheckin:function(slug,cond){location.hash="#/checkin/"+slug+"/"+cond;},
    ciChoose:function(v){var qs=ciItems(),i=ci.idx;ci.answers[i]=v;if(i===qs.length-1&&v>0){ci.done="crisis";return ciRender();}setTimeout(function(){if(i+1<qs.length){ci.idx++;ciRender();}else{ci.done="result";ciRender();}},150);},
    ciReset:function(){ci.idx=0;ci.answers=[];ci.done=null;ciRender();},
    toggleTask:function(vi,ti){store.visits[vi].tasks[ti].done=!store.visits[vi].tasks[ti].done;persist();render();}
  };

  document.addEventListener("keydown",function(e){if(sc&&!sc.done&&location.hash.indexOf("#/screener")===0){var n=parseInt(e.key,10);if(n>=1&&n<=4)CP.scChoose(n-1);}if(ci&&!ci.done&&location.hash.indexOf("#/checkin")===0){var m=parseInt(e.key,10);if(m>=1&&m<=4)CP.ciChoose(m-1);}});

  if(!location.hash)location.hash="#/";
  render();
})();
</script>
